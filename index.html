<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hijri Calendar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <div>
          <p class="app__eyebrow">Islamic Hijri Calendar</p>
          <h1 class="app__title" id="monthTitle">Hijri Calendar</h1>
        </div>
        <div class="app__today" id="todayCard">
          <span class="app__today-label">Today in Hijri</span>
          <span class="app__today-date" id="todayHijri">--</span>
          <span class="app__today-gregorian" id="todayGregorian">--</span>
        </div>
      </header>

      <section class="calendar">
        <div class="calendar__weekday">Sun</div>
        <div class="calendar__weekday">Mon</div>
        <div class="calendar__weekday">Tue</div>
        <div class="calendar__weekday">Wed</div>
        <div class="calendar__weekday">Thu</div>
        <div class="calendar__weekday">Fri</div>
        <div class="calendar__weekday">Sat</div>
      </section>

      <section class="calendar__grid" id="calendarGrid"></section>

      <footer class="app__footer">
        <p>Hijri dates are calculated using the Islamic calendar locale in your browser.</p>
      </footer>
    </div>

    <div class="reminder-modal" id="reminderModal" aria-hidden="true">
      <div class="reminder-modal__backdrop" data-reminder-close></div>
      <div
        class="reminder-modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="reminderModalTitle"
      >
        <div class="reminder-modal__header">
          <h2 id="reminderModalTitle">Reminder</h2>
          <button
            class="reminder-modal__icon-button"
            type="button"
            aria-label="Close reminder editor"
            data-reminder-close
          >
            ✕
          </button>
        </div>
        <p class="reminder-modal__subtitle" id="reminderModalSubtitle"></p>
        <label class="reminder-modal__label" for="reminderInput">Reminder details</label>
        <textarea
          id="reminderInput"
          class="reminder-modal__input"
          rows="4"
          placeholder="Add your reminder..."
        ></textarea>
        <p class="reminder-modal__error" id="reminderModalError" aria-live="polite"></p>
        <div class="reminder-modal__actions">
          <button class="reminder-modal__delete" type="button" id="reminderDelete">
            Delete reminder
          </button>
          <div class="reminder-modal__actions-right">
            <button class="reminder-modal__button" type="button" data-reminder-close>
              Cancel
            </button>
            <button class="reminder-modal__button reminder-modal__button--primary" type="button" id="reminderSave">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
